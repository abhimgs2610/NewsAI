spring.datasource.url=jdbc:h2:mem:newsai_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

newsapi.api-key=test-newsapi-key
gnews.api-key=
openai.api-key=test-openai-key
openai.url=https://api.groq.com/openai/v1/chat/completions
openai.model=llama-3.1-8b-instant

enrichment.retry.count=3
enrichment.retry.baseDelayMs=1500

sync.scheduler.enabled=false


